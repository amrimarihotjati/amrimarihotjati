  <!-- Col 1 -->
  <text x="56" y="258" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#5B8DEF">01 / APP PUBLISHING</text>
  <text x="56" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F9F8FA">Google Play Partner</text>
  <text x="56" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#68707A">Release cycles, ASO &amp; AdMob</text>

  <!-- Col 2 -->
  <text x="290" y="258" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#5B8DEF">02 / MOBILE NATIVE</text>
  <text x="290" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F9F8FA">Kotlin &amp; Jetpack Compose</text>
  <text x="290" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#68707A">Clean Architecture, MVVM &amp; RN</text>

  <!-- Col 3 -->
  <text x="524" y="258" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#5B8DEF">03 / WEB FRONTEND</text>
  <text x="524" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F9F8FA">React, Next.js &amp; TypeScript</text>
  <text x="524" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#68707A">Enterprise dashboards &amp; UI/UX</text>

  <!-- Col 4 -->
  <text x="758" y="258" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" fill="#5B8DEF">04 / AUTOMATION &amp; API</text>
  <text x="758" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F9F8FA">Serverless &amp; CI/CD Pipelines</text>
  <text x="758" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#68707A">GitHub Actions, Python &amp; Workers</text>

  
