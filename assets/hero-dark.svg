  <circle cx="346" cy="59" r="4" fill="#10B981"/>
  <text x="358" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#999FA5">Digital Product Specialist &amp; App Publisher</text>
  <text x="612" y="63" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" fill="#5B8DEF">@Screnix</text>

