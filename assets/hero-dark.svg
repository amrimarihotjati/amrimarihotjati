  <text x="500" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.8" fill="#F9F8FA" text-anchor="middle">Amri Marihot Jati</text>
  <text x="500" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.3" fill="#999FA5" text-anchor="middle">Bridging digital business vision with precise mobile &amp; frontend execution.</text>

  <!-- Sub-caption -->
  <text x="500" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#68707A" text-anchor="middle">
    Google Partner / App Publisher  ·  Android Native (Kotlin &amp; Jetpack Compose)  ·  Frontend Web (React, Next.js &amp; TypeScript)
  </text>

  <!-- Bottom 4-Column Structural Metric Strip -->
  <line x1="266" y1="232" x2="266" y2="308" stroke="#242933" stroke-width="1"/>
